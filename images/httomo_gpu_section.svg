  <title
     id="title">HTTomo sections: chaining GPU methods</title>
  <desc
     id="desc">Within one GPU section, each block from a CPU-resident chunk is copied to the GPU, processed sequentially by methods A, B and C while remaining in GPU memory, and copied back to the output chunk. The loop repeats for all blocks before the pipeline continues.</desc>
