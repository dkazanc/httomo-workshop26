- method: standard_tomo
  module_path: httomo.data.hdf.loaders
  parameters:
    data_path: /entry/data/data
    image_key_path: null
    rotation_angles:
      user_defined:
        start_angle: 0.0
        stop_angle: 180.0
        angles_total: 1801
    preview:
      detector_x:   # horizontal data previewing/cropping.
        # when null, the full data dimension is used, i.e., no previewing
        start: null
        stop: null
      detector_y:   # vertical data previewing/cropping.
        # when null, the full data dimension is used, i.e., no previewing
        start: 1000
        stop: 1050
    darks:
        file: /mnt/wwn-0x500003973bf02e59-part1/DATA_DANIIL/i12_beamline/static_scans/180degrees/Datasets_from_Nghia/DATA_DISTORTION/darks.hdf
        data_path: /entry/data/data
    flats:
        file: /mnt/wwn-0x500003973bf02e59-part1/DATA_DANIIL/i12_beamline/static_scans/180degrees/Datasets_from_Nghia/DATA_DISTORTION/flats.hdf
        data_path: /entry/data/data

# --- Calibration of projection data using collected flats/darks images. ---     
- method: dark_flat_field_correction
  module_path: httomolibgpu.prep.normalize
  parameters:
    flats_multiplier: 1.0
    darks_multiplier: 1.0
    upper_bound: null
    lower_bound: null
    clipping_warning: false

# --- Applying optical distortion correction to projections. --- 
- method: distortion_correction_proj_discorpy
  module_path: httomolibgpu.prep.alignment
  parameters:
    metadata_path: null
    order: 1
    mode: reflect
    xcenter: 1230.99353849
    ycenter: 1018.86666868
    list_fact:
    - 1.00015857686
    - -1.00246012274e-06
    - -8.9859016203e-10
    - -2.31488898858e-12
    - 7.6288191801e-16

# --- Center of Rotation finder ---
- method: find_center_vo
  module_path: httomolibgpu.recon.rotation
  parameters:
    ind: mid
    average_radius: 3
    cor_initialisation_value: 1390
    smin: -100
    smax: 100
    srad: 6.0
    step: 0.5
    ratio: 0.5
    drop: 20
  id: centering
  side_outputs:
    cor: centre_of_rotation

# - method: minus_log
#   module_path: httomolibgpu.prep.normalize
#   parameters: {}
# --- Phase contrast operation ---
- method: paganin_filter
  module_path: httomolibgpu.prep.phase
  parameters:
    pixel_size: 32.4
    distance: 3.2
    energy: 53.0
    ratio_delta_beta: 250
    calculate_padding_value_method: next_power_of_2
    pad_x_y: null

# --- Reconstruction ---
- method: LPRec3d_tomobar
  module_path: httomolibgpu.recon.algorithm
  parameters:
    center: ${{centering.side_outputs.centre_of_rotation}}
    detector_pad: true
    filter_type: shepp
    filter_freq_cutoff: 1.0
    recon_size: null
    recon_mask_radius: 2.0